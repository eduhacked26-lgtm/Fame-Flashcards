<title>Fame Word Flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: a responsive grid of flip cards on a pale page; picture + word on the front, IPA, meaning and example on the back. Single light look on purpose. */
:root{--bg:#F6F9FD;--card:#FFFFFF;--ink:#1F3556;--soft:#5B6F8F;--line:#D5E1F2;--sky:#E4EFFC;--mint:#E1F4EC;--sun:#FFF3CF;--rose:#FBE4EA;--accent:#2F6FC4;--accent-ink:#FFFFFF;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',Arial,sans-serif;margin:0;padding-inline:max(16px,3vw);padding-block:24px 40px}
.wrap{max-width:1040px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:clamp(1.6rem,4vw,2.3rem);margin:0;line-height:1.1;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--soft);font-size:1rem;max-width:56ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{font:inherit;font-weight:800;font-size:.95rem;padding:.55em 1em;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.tools button:focus-visible,.card:focus-visible,.spk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px}
.card{perspective:900px;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:center;cursor:pointer;aspect-ratio:10/13;min-width:0;width:100%}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 14px 16px}
.front{background:var(--tint)}
.back{background:var(--card);transform:rotateY(180deg);justify-content:flex-start;padding-top:18px;gap:8px;overflow:auto}
.front img{width:min(62%,150px);height:auto;border-radius:18px;background:#fff;border:2px solid #fff}
.word{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:clamp(1.7rem,5vw,2.1rem);line-height:1}
.hint{font-size:.78rem;color:var(--soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.spk{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.spk:hover{background:var(--sky);border-color:var(--accent)}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spk svg{width:24px;height:24px}
.spk.small{width:36px;height:36px}.spk.small svg{width:19px;height:19px}
.row{display:flex;align-items:center;justify-content:center;gap:10px}
.back .word{font-size:1.6rem}
.ipa{font-family:'Noto Sans','DejaVu Sans',sans-serif;font-size:1.05rem;color:var(--accent);font-weight:600}
.pos{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);border-radius:999px;padding:.15em .7em;color:#7A5B00}
.mean{font-size:.98rem;line-height:1.3;margin:2px 0 0;text-wrap:balance}
.ex{font-size:.95rem;line-height:1.3;font-style:italic;background:var(--sky);border-radius:12px;padding:8px 10px;margin:0;width:100%;text-align:left}
.ex-row{display:flex;gap:8px;align-items:center;width:100%}
.note{margin-top:22px;color:var(--soft);font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
@media (max-width:520px){.card{aspect-ratio:5/8}.grid{grid-template-columns:1fr 1fr;gap:12px}.face{padding:10px}.back .mean,.ex{font-size:.85rem}.spk{width:40px;height:40px}.front img{width:60%}}
</style>
<div class="wrap">
<header>
<div><h1>Fame word flashcards</h1><p class="sub">Tap a card to turn it over. Tap the speaker to hear the word, and the speaker on the back to hear the example.</p></div>
<div class="tools"><button id="shuffle" type="button">Shuffle</button><button id="flipall" type="button">Turn all over</button><button id="reset" type="button">Reset</button></div>
</header>
<main class="grid" id="grid" aria-label="Flashcards"></main>
<p class="note" id="note">Sound uses your device's British English voice. If you hear nothing, check the volume and that your browser has an English voice installed.</p>
</div>

var TINTS=['#E4EFFC','#E1F4EC','#FFF3CF','#FBE4EA','#EAE6FA'];
var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';
var order=CARDS.map(function(_,i){return i}), voice=null, current=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices();
  voice=vs.find(function(v){return /^en[-_]GB/i.test(v.lang)})||vs.find(function(v){return /^en/i.test(v.lang)})||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
else document.getElementById('note').textContent='Sound is not available in this browser. Try Chrome, Edge or Safari.';
function say(text,btn){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  if(current)current.classList.remove('on');
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';u.rate=text.split(' ').length>1?0.88:0.8;
  if(voice)u.voice=voice;
  current=btn;btn.classList.add('on');
  u.onend=u.onerror=function(){btn.classList.remove('on')};
  speechSynthesis.speak(u);
}
function spk(label,text,small){
  var b=document.createElement('span');
  b.className='spk'+(small?' small':'');b.setAttribute('role','button');b.tabIndex=0;
  b.setAttribute('aria-label',label);b.innerHTML=ICON;
  function go(e){e.stopPropagation();if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault()}say(text,b)}
  b.addEventListener('click',go);b.addEventListener('keydown',go);
  return b;
}
function build(){
  var g=document.getElementById('grid');g.innerHTML='';
  order.forEach(function(i,pos){
    var c=CARDS[i];
    var card=document.createElement('div');
    card.className='card';card.setAttribute('role','button');card.tabIndex=0;
    card.setAttribute('aria-label','Flashcard: '+c.w+'. Press to turn over.');
    card.style.setProperty('--tint',TINTS[i%TINTS.length]);
    var inner=document.createElement('div');inner.className='inner';
    var f=document.createElement('div');f.className='face front';
    var im=document.createElement('img');im.src=c.img;im.alt='Picture for the word '+c.w;
    var w=document.createElement('div');w.className='word';w.textContent=c.w;
    var h=document.createElement('div');h.className='hint';h.textContent='Tap to turn over';
    var r=document.createElement('div');r.className='row';r.appendChild(spk('Listen to the word '+c.w,c.w));
    f.appendChild(im);f.appendChild(w);f.appendChild(r);f.appendChild(h);
    var b=document.createElement('div');b.className='face back';
    var top=document.createElement('div');top.className='row';
    var bw=document.createElement('div');bw.className='word';bw.textContent=c.w;
    top.appendChild(bw);top.appendChild(spk('Listen to the word '+c.w,c.w,true));
    var ip=document.createElement('div');ip.className='ipa';ip.textContent=c.ipa;
    var p=document.createElement('div');p.className='pos';p.textContent=c.pos;
    var m=document.createElement('p');m.className='mean';m.textContent=c.mean;
    var er=document.createElement('div');er.className='ex-row';
    var ex=document.createElement('p');ex.className='ex';ex.textContent=c.ex;
    er.appendChild(ex);er.appendChild(spk('Listen to the example sentence',c.ex,true));
    b.appendChild(top);b.appendChild(ip);b.appendChild(p);b.appendChild(m);b.appendChild(er);
    inner.appendChild(f);inner.appendChild(b);card.appendChild(inner);
    function flip(){card.classList.toggle('flipped');speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel()}
    card.addEventListener('click',flip);
    card.addEventListener('keydown',function(e){if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip()}});
    g.appendChild(card);
  });
}
document.getElementById('shuffle').onclick=function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}
  build();
};
document.getElementById('reset').onclick=function(){order=CARDS.map(function(_,i){return i});build()};
document.getElementById('flipall').onclick=function(){
  var cs=[].slice.call(document.querySelectorAll('.card'));
  var anyFront=cs.some(function(c){return !c.classList.contains('flipped')});
  cs.forEach(function(c){c.classList.toggle('flipped',anyFront)});
};
build();
</script>
